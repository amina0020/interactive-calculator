<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator">
    <h1>Calculator</h1>

    <div id="display" class="display" aria-live="polite">0</div>

    <div class="buttons">
      <button data-action="clear" class="special">AC</button>
      <button data-action="delete" class="special">DEL</button>
      <button data-value="(" class="operator">(</button>
      <button data-value=")" class="operator">)</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-value="/" class="operator">÷</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="*" class="operator">×</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value="-" class="operator">−</button>

      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button data-action="equals" class="equals">=</button>
      <button data-value="+" class="operator">+</button>
    </div>
    <p class="hint">Use your keyboard or click the buttons.</p>
  </main>
</body>
</html>
